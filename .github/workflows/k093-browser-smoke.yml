name: K-093 Hamuresu browser smoke QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'k080-history.js'
      - 'style.css'
      - 'assets/**'
      - 'qa/k093_browser_smoke.mjs'
      - '.github/workflows/k093-browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'k080-history.js'
      - 'style.css'
      - 'assets/**'
      - 'qa/k093_browser_smoke.mjs'
      - '.github/workflows/k093-browser-smoke.yml'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 > /tmp/k093-server.log 2>&1 &
      - name: Check desktop and mobile layout with actual site files
        run: node qa/k093_browser_smoke.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k093-hamuresu-layouts
          path: qa-results/*.png
          if-no-files-found: ignore
          retention-days: 7
